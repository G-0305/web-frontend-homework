<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>动态表格</title>
</head>
<body>
<table border="1" align="center" width="80%"
       cellspacing="0" cellpadding="5">
    <tr>
        <td>班级管理&nbsp;</td>
    </tr>
    <tr>
        <td>
            <table border="1" align="center" width="80%"
                   cellspacing="0" cellpadding="5">
                <thead>
                <tr>
                    <td>序号</td>
                    <td>名称</td>
                    <td>简介</td>
                    <td>操作</td>
                </tr>
                </thead>
                <tbody id="mytbody">
                </tbody>
            </table>
            <br>
            <button onclick="add()">新增班级</button>
        </td>
    </tr>
</table>

<script>
    // 新增
    function add() {
        let clazz = prompt('请输入班级名称', '软件240');
        if (clazz == null || clazz == '') {
            return;
        }
        let tbody = document.getElementById('mytbody');
        let length = tbody.rows.length;
        let newRow = tbody.insertRow(length);

        let cell0 = newRow.insertCell(0);
        cell0.innerText = length + 1;

        let cell1 = newRow.insertCell(1);
        cell1.innerText = clazz;

        let cell2 = newRow.insertCell(2);
        cell2.innerText = clazz + '..............';

        let cell3 = newRow.insertCell(3);
        cell3.innerHTML = `<button>修改</button>&nbsp;<button onclick="del(this)">删除</button>`;
    }

    // 删除
    function del(obj) {
        if(confirm('确定删除该数据吗')){
            let row = obj.parentElement.parentElement;
            let tbody = document.getElementById('mytbody');
            tbody.removeChild(row);

        }
    }
</script>
</body>
</html>

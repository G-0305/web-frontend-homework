<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>fetch</title>
</head>
<body>
<button onclick="fn1()">fetch</button>
<script>
    //fetch:返回一个promise对象

    function fn1(){
        let resPromise = fetch('http://localhost:3000/clazz');
        resPromise.then(res => res.json())
            .then((data) => {
                console.log(data);//返回一个对象
            })
            .catch(err => console.log(err));
    }
    async function fn2(){
        let resPromise = fetch('http://localhost:3000/clazz');
        let data = await resPromise.json()
    }
</script>
</body>
</html>

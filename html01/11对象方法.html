<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>对象方法</title>
</head>
<body>
<script>
    //toString
    let employee = {
        name:'张三',
        salary:5000
    }
    //默认的toString方法
    console.log(employee.toString());
    //重写toString方法
    employee.toString = function (){
        return`
        {
            name:${employee.name},
            salary:${employee.salary},
        }
        `
    }
    console.log(employee.toString());

    //valueOf()
    console.log(employee.valueOf());
    //重写valueOf方法
    employee.valueOf = function (){
        return this.salary;
    }
    console.log(employee.valueOf());
</script>

</body>
</html>

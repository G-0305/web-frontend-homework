<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>数组方法</title>
</head>
<body>
<script>
    //forEach（）方法：接收一个函数
    let arr1 = [1,2,3,4,5]
    let sum = 0
    function fn1(x){
        sum += x
    }
    //把函数传入forEach,对数组的每个元素进行处理（求和）
    arr1.forEach(x=> sum +=x)//arr1.forEarch(fn1)
    console.log('sum=',sum)

    // 传入的函数的参数如果是三个：
    //第一个参数（v）表示数组元素
    //第二个参数（index）表示当前元素的下标
    //第三个参数（arr）表示当前数组
    let arr2 = ['a','b','c','d']
    arr2.forEach((v,index,arr)=>{
        console.log(v+''+index+'',arr)
    })
    //注意：forEach迭代数组不能中断

    //map方法：接受一个函数（映射函数）
    //数组的每个元素通过该函数进行处理，返回一个新数组
    let arr3 = [1,2,3,4,5]
    console.log(arr3)
    let arr3_1 = arr3.map(x=>x*x)
    console.log(arr3_1)
    //map方法会或略稀疏数组中空的位置
    let arr3_2 = [1,,3,,5]
    console.log(arr3_2);
    let arr3_3 = arr3_2.map(x=>x*x)
    console.log(arr3_3)

    //filter方法；接受一个函数（过滤函数）
    //使用该函数对数组元素进行条件判断
    //符合该条件的元素构成一个新数组
    //过滤函数必须是一个断言函数：返回true/false
    let arr4 = [1,2,3,4,5]
    console.log(arr4)
    let arr4_1 = arr4.filter(x=>x%2==0)
    console.log(arr4_1);
    //filter方法会清除稀疏数组中的空位置
    let arr4_3 = [1,,3,4,,6,7]
    console.log(arr4_3);
    let arr4_4 = arr4_3.filter(()=>true)
    console.log(arr4_4)
    //也可以使用filter方法处理数组中null、undefined
    let arr4_5 = [1,,3,null,4,,6,undefined,7]
    console.log(arr4_5)
    let arr4_6 = arr4_5.filter(x=>x!=null && x!=undefined)
    console.log(arr4_6)

    //reduce方法：接受一个函数（归并函数）
    //数组元素通过归并函数进行归并处理，最终返回一个值
    let arr5 = [1,2,3,4,5]
    //如果reduce（）方法，只传入一个参数（归并函数）：（a，b）=>a+b
    let result1 = arr5.reduce((a,b)=> a+b)
    console.log(result1)
    //归并函数的参数a，b;第一次迭代a为数组第一个元素，b为第二个元素
    //第2次后，a为上一次归并的结果，b为数组下一个元素
    let result2 = arr5.reduce((a,b)=> {
        console.log(`a=${a} b=${b}`,a+b)
        return a+b
    })
    //如果reduce方法（），传入两个参数
    //reduce（）方法的第一个参数，（a，b）=>a+b
    //reduce()的第二个参数7：
    //归并函数a，b
    //第一次迭代：a为reduce方法的第2个参数7-->归并的默认值，b为数组第一个元素
    //第二次迭代：a为上一次迭代结果，b为下一个数组元素
    let result3 = arr5.reduce((a,b)=> {
        console.log(`a=${a} b=${b}`,a+b)
        return a+b
    },7)
    console.log(result3)

    //push方法：
    let arr6 = ['a','b','c','d']
    console.log(arr6)
    arr6.push('k')
    console.log(arr6)
    //pop方法：数组尾部弹出一个元素，并返回
    let result4 = arr6.pop()
    console.log(result4)
    console.log(arr6)

    //unshift：从数组头部压入一个元素
    arr6.unshift('m')
    console.log(arr6)
    //shift：从数组头部移出一个元素，并返回
    let result5 = arr6.shift()
    console.log(result5)
    console.log(arr6)

    //slice：从数组抽取子数组
    let arr7 = ['a','b','c','d','e','f']
    console.log(arr7)
    let arr7_1 = arr7.slice(2,4)
    console.log(arr7_1)

    //splce:模拟数组的增删改操作
    let arr8 = ['a','b','c','d','e','f']
    console.log(arr8)
    //删除：第一个参数指定删除的位置，第二个指定删除的个数
    let arr8_1 = arr8.splice(2,4)
    console.log(arr8_1)
    //插入：
    //第一个参数指定插入的位置
    //第二格参数为0（表示不删除）
    //第三个参数：要插入的元素
    let arr9 = ['a','b','c','d','e','f']
    console.log(arr9)
    arr9.splice(2,0,'k')
    console.log(arr9)
    //修改：
    //第一个参数指定修改的下标
    //第二个参数1：（表示先删除一个）
    //第三个参数：新修改的元素（后插入）
    let arr10 = ['a','b','c','d','e','f']
    console.log(arr10)
    arr10.splice(2,1,'m')
    console.log(arr10)
    //数组结构：使用对应的变量把数组元素取出
    let arr11 = ['a','b','c','d','e','f']
    let [first,second] = arr11
    console.log(first)
    console.log(second)



</script>

</body>
</html>
